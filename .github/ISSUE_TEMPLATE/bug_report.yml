name: 问题报告 / Bug report
description: 报告一个可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请勿在报告中包含密钥、令牌或个人敏感信息。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 清晰简洁地描述问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 1. 打开... 2. 点击... 3. 看到错误
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: "例如 1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      placeholder: "例如 Android 14, Pixel 7"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选，请脱敏）
      render: shell
